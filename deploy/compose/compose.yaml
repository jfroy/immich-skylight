# Docker Compose deployment.
#
#   cp .env.example .env && $EDITOR .env
#   docker compose run --rm immich-skylight frames               # list frame IDs
#   DRY_RUN=true docker compose run --rm immich-skylight sync    # preview
#   docker compose up -d
#
# If Immich runs in Compose on the same host, put both on a shared network and
# set IMMICH_URL=http://immich-server:2283 in .env.
services:
  immich-skylight:
    image: ghcr.io/jfroy/immich-skylight:latest
    container_name: immich-skylight
    restart: unless-stopped
    command: [run]
    env_file: .env
    environment:
      STATE_FILE: /data/state.db
      HTTP_ADDR: :8080
    volumes:
      - state:/data
    ports:
      - "127.0.0.1:8080:8080" # /metrics, /healthz, /readyz
    # Same hardening as the Kubernetes manifests.
    user: "65532:65532"
    read_only: true
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    healthcheck:
      # distroless has no shell/curl; the image's own binary can't probe either, so
      # rely on the orchestrator-level restart policy or an external check of /healthz.
      disable: true
    deploy:
      resources:
        limits:
          memory: 512M

volumes:
  state:
